name: rhc-aep-tracker

on:
  schedule:
    - cron: "17 */12 * * *"   # every 12h (UTC). Change to "17 6 * * *" for daily.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tracker
        run: python tracker/tracker.py
      - name: Commit results
        run: |
          git config user.name "rhc-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "tracker: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push
